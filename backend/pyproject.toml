[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]  # long Russian UI strings
# API field names mirror the frontend contract (camelCase), so naming rules are not enforced on schemas.
